header:
  version: 14

repos:
  meta-spdx-diff:
    url: https://github.com/bootlin/meta-spdx-diff
    branch: "scarthgap"
    path: layers/meta-spdx-diff

local_conf_header:
  sbom: |
    # Disable spdx2.2 as it's default spdx version in scarthgap
    INHERIT:remove = "create-spdx"
    INHERIT += "create-spdx-3.0"

  spdx-diff: |
    INHERIT += "spdx-diff"

    SPDX_INCLUDE_KERNEL_CONFIG = "1"
    SPDX_INCLUDE_PACKAGECONFIG = "1"
